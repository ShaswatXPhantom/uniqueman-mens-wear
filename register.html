<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Uniqueman Men's Wear</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="subtitle">Join Uniqueman to pre-book exclusive styles</p>
      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('');
    document.getElementById('footer').innerHTML = renderFooter();

    if (isLoggedIn()) {
      window.location.href = 'index.html';
    }

    function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const result = register(form.name.value, form.email.value, form.password.value);
      if (result.success) {
        showToast('Account created! Welcome to Uniqueman.', 'success');
        setTimeout(() => window.location.href = 'index.html', 800);
      } else {
        showToast(result.message, 'error');
      }
    }
  </script>
</body>
</html>
