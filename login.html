<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Uniqueman Men's Wear</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--coffee-500); font-size: 0.85rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--coffee-200); }
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%;
      padding: 0.75rem 1rem; border: 1.5px solid var(--coffee-200); border-radius: 8px;
      background: white; font-size: 0.95rem; font-weight: 500; color: var(--coffee-800);
      cursor: pointer; transition: var(--transition);
    }
    .google-btn:hover { background: var(--coffee-50); border-color: var(--coffee-300); }
    .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--coffee-100); }
    .auth-tabs a { flex: 1; text-align: center; padding: 0.75rem; font-weight: 500; color: var(--coffee-500); border-bottom: 2px solid transparent; }
    .auth-tabs a.active { color: var(--coffee-800); border-bottom-color: var(--coffee-600); }
  </style>
</head>
<body>
  <div id="header"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-tabs">
        <a href="login.html" class="active">Login</a>
        <a href="register.html">Sign Up</a>
      </div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to pre-book & manage your wishlist</p>
      <button type="button" class="google-btn" id="google-signin-btn" onclick="handleGoogleSignIn()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
      <div class="divider">or</div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <div class="auth-footer">
        New here? <a href="register.html">Create an account</a>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('');
    document.getElementById('footer').innerHTML = renderFooter();
    if (isLoggedIn()) window.location.href = isAdmin() ? 'admin.html' : 'index.html';
    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const result = await login(form.email.value, form.password.value);
      if (result.success) {
        showToast('Welcome back, ' + result.user.name + '!', 'success');
        setTimeout(() => { window.location.href = result.user.role === 'admin' ? 'admin.html' : 'index.html'; }, 800);
      } else showToast(result.message, 'error');
    }
    function handleGoogleSignIn() {
      const name = prompt('Google Sign-In (Demo)\n\nEnter your name:');
      if (!name || !name.trim()) return;
      const email = prompt('Enter your Google email:');
      if (!email || !email.includes('@')) { showToast('Valid email required', 'error'); return; }
      const result = loginOrRegisterWithGoogle(name.trim(), email.trim().toLowerCase());
      if (result.success) {
        showToast('Signed in with Google!', 'success');
        setTimeout(() => { window.location.href = result.user.role === 'admin' ? 'admin.html' : 'index.html'; }, 800);
      } else showToast(result.message || 'Something went wrong', 'error');
    }
  </script>
</body>
</html>
