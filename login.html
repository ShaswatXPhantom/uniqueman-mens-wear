<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Uniqueman Men's Wear</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to pre-book & manage your wishlist</p>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
      <div style="margin-top:1.5rem;padding:1rem;background:var(--coffee-50);border-radius:8px;font-size:0.85rem;color:var(--coffee-600)">
        <strong>Demo Admin:</strong><br>
        Email: admin@uniqueman.com<br>
        Password: admin123
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('');
    document.getElementById('footer').innerHTML = renderFooter();

    if (isLoggedIn()) {
      window.location.href = isAdmin() ? 'admin.html' : 'index.html';
    }

    function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const result = login(form.email.value, form.password.value);
      if (result.success) {
        showToast('Welcome back, ' + result.user.name + '!', 'success');
        setTimeout(() => {
          window.location.href = result.user.role === 'admin' ? 'admin.html' : 'index.html';
        }, 800);
      } else {
        showToast(result.message, 'error');
      }
    }
  </script>
</body>
</html>
