<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Uniqueman Men's Wear</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Visit Us</h2>
      <p class="section-subtitle">We're waiting for you at Jhilmil</p>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem;max-width:900px;margin:0 auto">
        <div style="background:white;padding:2rem;border-radius:16px;box-shadow:var(--shadow)">
          <h3 style="margin-bottom:1rem">Store Location</h3>
          <p style="margin-bottom:0.8rem"><strong>Address</strong><br>B-210, 1st Floor, Jhilmil<br>Near Garam Masala<br>Delhi 110095</p>
          <p style="margin-bottom:0.8rem"><strong>Phone</strong><br><a href="tel:+918796246647">+91 87962 46647</a></p>
          <p style="margin-bottom:1rem"><strong>Hours</strong><br>Mon–Sat: 11 AM – 9 PM<br>Sun: 12 PM – 8 PM</p>
          <a href="https://wa.me/918796246647" target="_blank" class="btn btn-primary" style="margin-right:0.5rem">WhatsApp</a>
          <a href="https://www.instagram.com/_uniqueman__/" target="_blank" class="btn btn-outline">Instagram</a>
        </div>

        <div style="background:white;padding:2rem;border-radius:16px;box-shadow:var(--shadow)">
          <h3 style="margin-bottom:1rem">Send a Message</h3>
          <form onsubmit="handleContact(event)">
            <div class="form-group">
              <label>Name</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" name="phone" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Message</label>
              <textarea name="message" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('contact');
    document.getElementById('footer').innerHTML = renderFooter();

    function handleContact(e) {
      e.preventDefault();
      showToast('Thanks! We will get back to you soon on WhatsApp/phone.', 'success');
      e.target.reset();
    }
  </script>
</body>
</html>
