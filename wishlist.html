<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | Uniqueman Men's Wear</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title">My Wishlist</h2>
      <p class="section-subtitle">Items you've saved for later</p>
      <div class="product-grid" id="wishlist-grid"></div>
      <div id="empty-wishlist" class="empty-state hidden">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <p>Your wishlist is empty.</p>
        <a href="products.html" class="btn btn-primary mt-2">Browse Collection</a>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('wishlist');
    document.getElementById('footer').innerHTML = renderFooter();

    function loadWishlist() {
      if (!isLoggedIn()) {
        document.getElementById('wishlist-grid').innerHTML = '';
        document.getElementById('empty-wishlist').classList.remove('hidden');
        document.getElementById('empty-wishlist').innerHTML = `
          <p>Please login to view your wishlist.</p>
          <a href="login.html" class="btn btn-primary mt-2">Login</a>
        `;
        return;
      }

      const ids = getWishlist();
      const products = getProducts().filter(p => ids.includes(p.id));
      const grid = document.getElementById('wishlist-grid');
      const empty = document.getElementById('empty-wishlist');

      if (products.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = products.map(renderProductCard).join('');
      }
    }

    loadWishlist();
  </script>
</body>
</html>
